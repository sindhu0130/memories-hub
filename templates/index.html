<!DOCTYPE html>
<html>
<head>
    <title>Memories Hub</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ede9fe, #e0e7ff, #fdf2f8);
        }

        /* HERO */
        .hero {
            padding: 50px 20px;
        }

        .gradient-text {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(to right, #7c3aed, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #6b7280;
        }

        .btn-main {
            padding: 14px 28px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #7c3aed, #6366f1);
            color: white;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
        }

        .btn-main:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(124,58,237,0.4);
        }

        /* SECTION */
        .section {
            margin: 40px auto;
            max-width: 1000px;
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 30px;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        /* CARD */
        .card2 {
            background: rgba(255,255,255,0.6);
            padding: 25px;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }

        .card2:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(124,58,237,0.2);
        }

        /* AVATAR */
        .avatar {
            width: 70px;
            height: 70px;
            margin: auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 10px;
        }

        /* SUCCESS POPUP */
        #successPopup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 999;
            text-align: center;
        }

        /* HEART ANIMATION */
        .heart {
            position: fixed;
            font-size: 20px;
            animation: floatUp 3s linear;
        }

        @keyframes floatUp {
            from { transform: translateY(0); opacity:1; }
            to { transform: translateY(-200px); opacity:0; }
        }

        /* FOOTER */
        .footer {
            margin-top: 40px;
            padding: 20px;
            color: #6b7280;
        }

        .creator {
            color: #7c3aed;
            font-weight: bold;
        }
    </style>
</head>

<body>

<!-- HERO -->
<div class="hero">
    <h1 class="gradient-text">Memories Hub 💜</h1>
    <p class="subtitle">
        Write something your friends will smile reading someday 💌
    </p>

    <a href="#people">
        <button class="btn-main">💌 Write a Memory</button>
    </a>
</div>

<!-- PEOPLE -->
<div id="people" class="section">
    <h2>Our People 💖</h2>
    <p>Every name here holds a memory ✨</p>

    <div class="grid">

        {% for name in friends %}
        <a href="/message/{{ name }}" style="text-decoration:none; color:black;">
            <div class="card2">
                <div class="avatar">{{ name[0] }}</div>
                <h3>{{ name }}</h3>
            </div>
        </a>
        {% endfor %}

    </div>
</div>

<!-- 💌 SUCCESS POPUP -->
<div id="successPopup">
    <h3>💌 Message Sent!</h3>
    <p>Your memory has been saved 💜</p>
</div>

<!-- FOOTER -->
<footer class="footer">
    © 2026 Memories Hub 💜 — Created by 
    <span class="creator">Sindhu</span>
</footer>

<!-- SCRIPT -->
<script>
const params = new URLSearchParams(window.location.search);

if (params.get("success")) {
    showSuccess();
}

function showSuccess() {
    const popup = document.getElementById("successPopup");
    popup.style.display = "block";

    // 💜 floating hearts
    for(let i=0;i<20;i++){
        let heart = document.createElement("div");
        heart.innerHTML = "💜";
        heart.className = "heart";
        heart.style.left = Math.random()*100 + "%";
        heart.style.top = "60%";
        document.body.appendChild(heart);

        setTimeout(()=>heart.remove(),3000);
    }

    // auto hide
    setTimeout(()=>{
        popup.style.display = "none";
    }, 2500);
}
</script>

</body>
</html>
