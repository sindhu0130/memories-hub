<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #ede9fe, #fdf2f8);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        input {
            padding: 10px;
            width: 100%;
            margin-top: 10px;
            border-radius: 10px;
            border: none;
            background: #f3f4f6;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            border-radius: 20px;
            border: none;
            background: #7c3aed;
            color: white;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>🔐 Admin Login</h2>

    <form method="POST">
        <input type="password" name="password" placeholder="Enter password" required>
        <button>Login</button>
    </form>
</div>

</body>
</html>
