<!DOCTYPE html>
<html>
<head>
    <title>Write Memory</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ede9fe, #fdf2f8);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 30px;
            width: 340px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(124,58,237,0.2);
            animation: pop 0.4s ease;
        }

        @keyframes pop {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .avatar {
            width: 90px;
            height: 90px;
            margin: auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            box-shadow: 0 10px 25px rgba(236,72,153,0.5);
            margin-bottom: 10px;
        }

        h2 {
            margin: 10px 0;
        }

        .subtitle {
            font-size: 13px;
            color: gray;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: #f3f4f6;
            margin-top: 12px;
            outline: none;
            transition: 0.2s;
        }

        input:focus, textarea:focus {
            background: white;
            box-shadow: 0 0 0 2px #7c3aed;
        }

        textarea {
            height: 100px;
        }

        button {
            margin-top: 15px;
            padding: 14px;
            width: 100%;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #7c3aed, #6366f1);
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(124,58,237,0.4);
        }

        .back {
            margin-top: 15px;
            display: inline-block;
            font-size: 13px;
            color: #7c3aed;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="avatar">{{ name[0] }}</div>
    <h2>{{ name }}</h2>
    <p class="subtitle">Write something they’ll remember forever 💌</p>

    <form method="POST">
        <input type="text" name="sender" placeholder="Your name..." required>
        <textarea name="message" placeholder="Write your message..." required></textarea>
        <button>💌 Send Message</button>
    </form>

    <!-- 🔙 BACK BUTTON -->
    <a href="/" class="back">← Back to Memories Hub</a>

</div>

</body>
</html>
