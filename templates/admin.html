<!DOCTYPE html>
<html>
<head>
    <title>All Messages</title>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ede9fe, #fdf2f8);
            text-align: center;
            margin: 0;
            padding: 0;
        }

        h2 {
            color: #7c3aed;
            margin-top: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .person-box {
            background: white;
            margin: 20px;
            padding: 20px;
            border-radius: 20px;
            text-align: left;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .person-name {
            font-size: 22px;
            color: #7c3aed;
            margin-bottom: 10px;
        }

        .msg {
            background: #f3f4f6;
            padding: 10px;
            border-radius: 10px;
            margin: 8px 0;
        }

        .download-btn {
            margin-bottom: 10px;
            padding: 8px 15px;
            border-radius: 20px;
            border: none;
            background: #6366f1;
            color: white;
            cursor: pointer;
        }

        .download-btn:hover {
            background: #4f46e5;
        }
    </style>
</head>

<body>

<h2>💌 All Messages (Admin)</h2>

<div class="container">

{% for person, msgs in messages.items() %}
<div class="person-box">

    <div class="person-name">💖 {{ person }}</div>

    <!-- 📄 DOWNLOAD PDF BUTTON -->
    <a href="/download-pdf/{{ person }}">
        <button class="download-btn">📄 Download PDF</button>
    </a>

    <!-- 💬 MESSAGES -->
    {% for m in msgs %}
        <div class="msg">
            <b>{{ m[0] }}</b>: {{ m[1] }}
        </div>
    {% endfor %}

</div>
{% endfor %}

</div>

</body>
</html>
